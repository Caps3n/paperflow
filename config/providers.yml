# Provider-Konfiguration
# Setze 'enabled: true' um einen Provider zu aktivieren

providers:
  amazon:
    enabled: true
    # Paperless-Tag der automatisch gesetzt wird
    tags: ["Amazon", "Rechnung"]
    # Paperless-Correspondent
    correspondent: "Amazon"

  # PayPal: CDP-Modus mit manuellem Login (umgeht den Passkey-Dialog, der den
  # vorherigen automatisierten Login blockiert hat)
  paypal:
    enabled: false
    tags: ["PayPal", "Kontoauszug"]
    correspondent: "PayPal"

  ikea:
    enabled: false
    tags: ["IKEA", "Kassenbon"]
    correspondent: "IKEA"

  klarna:
    enabled: false
    tags: ["Klarna", "Kaufbeleg"]
    correspondent: "Klarna"

  # Weitere Provider können hier hinzugefügt werden:
  # ebay:
  #   enabled: false
  #   tags: ["eBay", "Rechnung"]
  #   correspondent: "eBay"
