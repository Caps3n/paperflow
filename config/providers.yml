# Provider-Konfiguration
# Setze 'enabled: true' um einen Provider zu aktivieren

providers:
  amazon:
    enabled: true
    # Paperless-Tag der automatisch gesetzt wird
    tags: ["Amazon", "Rechnung"]
    # Paperless-Correspondent
    correspondent: "Amazon"

  # PayPal: aktuell nicht unterstützt. PayPal verlangt für den Berichte-Bereich
  # (Kontoauszüge) bei jedem Zugriff eine frische 2FA-Bestätigung ("Step-up"),
  # unabhängig vom normalen Login-Status, ganz ohne "Gerät merken"-Option.
  # Das lässt sich nicht automatisieren (und sollte es auch nicht) – siehe
  # CHANGELOG.
  # paypal:
  #   enabled: false
  #   tags: ["PayPal", "Kontoauszug"]
  #   correspondent: "PayPal"

  ikea:
    enabled: false
    tags: ["IKEA", "Kassenbon"]
    correspondent: "IKEA"

  klarna:
    enabled: false
    tags: ["Klarna", "Kaufbeleg"]
    correspondent: "Klarna"

  hpinstantink:
    enabled: false
    tags: ["HP Instant Ink", "Rechnung"]
    correspondent: "HP"

  # Weitere Provider können hier hinzugefügt werden:
  # ebay:
  #   enabled: false
  #   tags: ["eBay", "Rechnung"]
  #   correspondent: "eBay"
